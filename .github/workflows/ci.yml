name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oneauth
          POSTGRES_PASSWORD: oneauth
          POSTGRES_DB: oneauth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oneauth -d oneauth_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://oneauth:oneauth@localhost:5432/oneauth_test
      E2E_DATABASE_URL: postgres://oneauth:oneauth@localhost:5432/oneauth_e2e
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, reviewed tag 2026-11-02
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: PGPASSWORD=oneauth psql -h localhost -U oneauth -d oneauth_test -c 'create database oneauth_e2e'
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:e2e
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
