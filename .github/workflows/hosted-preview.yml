name: Hosted preview verification

# Manual only: exercises a deployed preview with real WebAuthn ceremonies.
# Requires repository secrets ONEAUTH_HOSTED_URL (canonical preview origin) and
# VERCEL_AUTOMATION_BYPASS_SECRET (Vercel → Settings → Deployment Protection).
on:
  workflow_dispatch:

jobs:
  hosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, reviewed tag 2026-11-02
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.hosted.config.ts
        env:
          ONEAUTH_HOSTED_URL: ${{ secrets.ONEAUTH_HOSTED_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: hosted-results
          path: test-results/
          retention-days: 7
